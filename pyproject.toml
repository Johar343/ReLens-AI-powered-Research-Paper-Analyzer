[project]
name = "nlpproject"
version = "0.1.0"
requires-python = ">=3.13, <3.14"
dependencies = [
    "fastapi>=0.163.2",
    "google-genai>=3.5.0",
    "nltk>=3.10.4",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "requests>=2.34.2",
    "spacy>=3.8.0,<4",
    "sentencepiece>=0.2.3",
    "torch==2.14.1",
    "transformers>=5.23.0",
    "uvicorn[standard]>=0.54.0",
    "yake>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
